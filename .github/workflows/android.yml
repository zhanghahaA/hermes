name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    name: 构建 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APKs
        run: ./gradlew --no-configuration-cache assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-mobile-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

  ui-preview:
    name: 渲染界面截图
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 桌面图形依赖使用 JDK 21，与已验证的开发环境保持一致。
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Install CJK font
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Gesture tests
        working-directory: tools/ui-preview
        run: gradle --no-daemon test
      - name: Render screenshots
        working-directory: tools/ui-preview
        run: gradle --no-daemon run
      - uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: tools/ui-preview/screenshots/*.png
